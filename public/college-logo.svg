<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <path id="bottomArcPath" d="M 95 385 A 215 215 0 0 0 405 385" fill="none" />
    <path id="mottoArcPath" d="M 125 382 A 165 165 0 0 1 375 382" fill="none" />
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background circle (clean white) -->
  <circle cx="250" cy="250" r="230" fill="#ffffff" />

  <!-- Top Temple Spire / Kalasha Finial -->
  <g fill="#111827">
    <path d="M 250 18 C 248 24 246 32 245 42 L 255 42 C 254 32 252 24 250 18 Z" />
    <circle cx="250" cy="26" r="4" />
    <ellipse cx="250" cy="38" rx="7" ry="4" />
    <path d="M 240 46 C 244 42 256 42 260 46 C 263 52 258 56 250 56 C 242 56 237 52 240 46 Z" />
    <circle cx="250" cy="50" r="2" fill="#fff" />
  </g>

  <!-- Outer Concentric Rings -->
  <!-- Outer thick circle -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#111827" stroke-width="6.5" />
  <!-- Outer thin frame ring -->
  <circle cx="250" cy="250" r="212" fill="none" stroke="#111827" stroke-width="2" />
  <!-- Inner boundary ring -->
  <circle cx="250" cy="250" r="186" fill="none" stroke="#111827" stroke-width="3" />

  <!-- Side decorative scroll brackets -->
  <path d="M 46 220 C 44 240 47 270 55 295 C 47 270 45 240 46 220 Z" fill="#111827" />
  <path d="M 454 220 C 456 240 453 270 445 295 C 453 270 455 240 454 220 Z" fill="#111827" />

  <!-- Central Arch and Hanging Diya Lamp -->
  <!-- Hanging chain/rod -->
  <line x1="250" y1="64" x2="250" y2="120" stroke="#111827" stroke-width="2.5" />
  <!-- Teardrop canopy above medallion -->
  <path d="M 250 110 C 235 125 210 160 210 185 C 210 195 215 200 220 205 L 280 205 C 285 200 290 195 290 185 C 290 160 265 125 250 110 Z" fill="none" stroke="#111827" stroke-width="2" />

  <!-- Diya Medallion Circle -->
  <circle cx="250" cy="172" r="38" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  <circle cx="250" cy="172" r="35" fill="none" stroke="#111827" stroke-width="1.2" />

  <!-- Burning Diya / Oil Lamp Inside Medallion -->
  <!-- Crescent lamp bowl -->
  <path d="M 228 172 C 232 186 268 186 272 172 C 265 178 235 178 228 172 Z" fill="#111827" />
  <!-- Flame -->
  <path d="M 250 148 C 244 157 244 165 250 170 C 256 165 256 157 250 148 Z" fill="#111827" />

  <!-- Central Dark Triangle (Mountain Peak / Stupa) -->
  <path d="M 115 372 L 250 196 L 385 372 Z" fill="#111827" />

  <!-- Boat (Boita) on Central Triangle -->
  <g fill="#ffffff" stroke="#ffffff">
    <!-- Boat Hull -->
    <path d="M 194 286 C 205 315 295 315 306 286 C 280 292 220 292 194 286 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <!-- Center cabin blocks (Maritime trade heritage) -->
    <rect x="234" y="270" width="32" height="18" rx="2" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect x="241" y="259" width="18" height="11" rx="1.5" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect x="247" y="252" width="6" height="7" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
    <!-- Cabin Windows -->
    <rect x="238" y="274" width="6" height="7" fill="#111827" />
    <rect x="247" y="274" width="6" height="7" fill="#111827" />
    <rect x="256" y="274" width="6" height="7" fill="#111827" />
    <!-- Mast / flag on prow -->
    <path d="M 204 284 C 200 274 205 264 218 260" fill="none" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Flowing River Waves (Water Currents beneath boat) -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M 124 358 Q 155 342 190 358 T 255 358 T 320 358 T 376 358" />
    <path d="M 132 344 Q 165 328 198 344 T 262 344 T 325 344 T 368 344" />
    <path d="M 145 330 Q 175 314 208 330 T 270 330 T 332 330 T 355 330" />
    <path d="M 160 316 Q 190 304 220 316 T 280 316 T 340 316" />
  </g>

  <!-- Left Side Illustration: Open Book with Quill & Inkpot -->
  <g id="leftSymbol" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open Book / Palm Leaf Manuscript -->
    <path d="M 112 178 L 138 168 L 160 216 L 134 230 Z" fill="#ffffff" stroke-width="2.8" />
    <path d="M 138 168 L 164 178 L 140 238 L 134 230 Z" fill="#ffffff" stroke-width="2.8" />
    <!-- Book Spine & Pages Lines -->
    <line x1="134" y1="230" x2="138" y2="168" stroke-width="2.5" />
    <line x1="120" y1="184" x2="133" y2="178" stroke-width="1.8" />
    <line x1="123" y1="194" x2="135" y2="188" stroke-width="1.8" />
    <line x1="126" y1="204" x2="137" y2="198" stroke-width="1.8" />
    <line x1="141" y1="180" x2="155" y2="188" stroke-width="1.8" />
    <line x1="140" y1="190" x2="152" y2="198" stroke-width="1.8" />
    <line x1="138" y1="200" x2="149" y2="208" stroke-width="1.8" />

    <!-- Inkpot (Dua) -->
    <path d="M 154 228 C 154 216 178 216 178 228 C 178 238 154 238 154 228 Z" fill="#ffffff" stroke-width="2.5" />
    <path d="M 158 220 L 174 220 L 174 224 L 158 224 Z" fill="#111827" />
    <!-- Ribbed detail on pot -->
    <path d="M 160 226 C 160 234 172 234 172 226" fill="none" stroke-width="1.2" />

    <!-- Feather Quill Pen -->
    <path d="M 168 222 C 172 205 186 170 204 140 C 196 156 186 174 182 192 C 176 190 170 196 168 205 Z" fill="#ffffff" stroke-width="2" />
    <line x1="168" y1="222" x2="204" y2="140" stroke-width="1.5" />
  </g>

  <!-- Right Side Illustration: Lekhani (Stylus) and Inkpot -->
  <g id="rightSymbol" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    <!-- Inkpot / Vessel on right -->
    <path d="M 326 230 C 326 218 348 218 348 230 C 348 240 326 240 326 230 Z" fill="#ffffff" stroke-width="2.5" />
    <path d="M 330 222 L 344 222 L 344 226 L 330 226 Z" fill="#111827" />
    <!-- Lekhani / Palm leaf stylus & feather -->
    <path d="M 338 224 L 358 150 C 362 165 372 175 392 185 C 378 185 366 195 362 210 Z" fill="#ffffff" stroke-width="2.5" />
    <line x1="338" y1="224" x2="358" y2="150" stroke-width="2" />
    <path d="M 372 230 C 372 218 394 218 394 230 C 394 240 372 240 372 230 Z" fill="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Banner Ribbons Across Lower Section -->
  <g id="bannerRibbon">
    <!-- Left Ribbon Fold "ESTD" -->
    <path d="M 10 342 L 115 342 L 122 388 L 18 388 L 32 365 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Right Ribbon Fold "1960" -->
    <path d="M 490 342 L 385 342 L 378 388 L 482 388 L 468 365 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Center Arched Ribbon for Sanskrit Motto -->
    <path d="M 115 342 C 160 380 340 380 385 342 L 378 394 C 335 428 165 428 122 394 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 122 394 C 165 424 335 424 378 394" fill="none" stroke="#111827" stroke-width="1.8" />

    <!-- Fold Crease Shadows -->
    <polygon points="115,342 122,388 112,392" fill="#111827" />
    <polygon points="385,342 378,388 388,392" fill="#111827" />

    <!-- "ESTD" Text -->
    <text x="65" y="373" font-family="'Cinzel', serif, 'Times New Roman'" font-size="28" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="1">ESTD</text>

    <!-- "1960" Text -->
    <text x="435" y="373" font-family="'Cinzel', serif, 'Times New Roman'" font-size="28" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="1">1960</text>
  </g>

  <!-- Sanskrit Motto in Arched Banner: नास्ति प्रज्ञा समं आभा -->
  <text font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="26" font-weight="800" fill="#111827" letter-spacing="1.5">
    <textPath href="#mottoArcPath" startOffset="50%" text-anchor="middle">
      नास्ति प्रज्ञा समं आभा
    </textPath>
  </text>

  <!-- Odia Inscription in Bottom Arc: ପଞ୍ଚାୟତ ମହାବିଦ୍ୟାଳୟ, ବରଗଡ଼ -->
  <text font-family="'Noto Sans Oriya', 'Kalinga', sans-serif" font-size="22" font-weight="800" fill="#111827" letter-spacing="1.2">
    <textPath href="#bottomArcPath" startOffset="50%" text-anchor="middle">
      ପଞ୍ଚାୟତ ମହାବିଦ୍ୟାଳୟ, ବରଗଡ଼
    </textPath>
  </text>
</svg>
